[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbus-mqtt-battery"
version = "0.0.0"

[tool.setuptools.packages.find]
include = ["dbus_mqtt_battery*"]

[tool.pylint.messages_control]
ignore-paths = ["^.venv/"]
# Venus OS specific patterns - expected due to framework constraints
disable = [
    "C0103",  # Invalid name (legacy naming conventions)
    "C0301",  # Line too long
    "C0302",  # Too many lines in module
    "C0413",  # Wrong import position
    "E0401",  # Unable to import (Victron libs not available locally)
    "R0801",  # Duplicate code
    "R0902",  # Too many instance attributes
    "R0903",  # Too few public methods
    "R0904",  # Too many public methods
    "R0911",  # Too many return statements
    "R0912",  # Too many branches
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
    "R0915",  # Too many statements
    "W0612",  # Unused variable
    "W0613",  # Unused argument
    "W0702",  # Bare except
    "W0718",  # Catching general Exception
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "F841",  # Local variable assigned but never used
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
