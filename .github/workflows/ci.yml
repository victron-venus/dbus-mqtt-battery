name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@875762362bb31b4899bf02fdf9e835188dc5eb80
    with:
      python-version: '3.11'
      run-type-check: false  # Disable type checking as the original didn't have it
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
