name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@dff3879fcdaf0d0eeb0145e50f7f034ab2e87b93 # main
    with:
      use-uv-lock: true
      dependency-extras: "dev,test"
      build-dependency-group: build
      python-version: '3.12.13'
      # Coverage gate disabled — package has no coverage instrumentation; add
      # --cov=dbus_mqtt_battery to the pytest args once coverage is added.
      coverage-threshold: 0
