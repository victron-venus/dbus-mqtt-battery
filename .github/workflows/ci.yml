name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@29a852ec4d1466fcbd9598dd01352a8d8454312d # main
    with:
      python-version: '3.12.13'
      # Coverage gate disabled — package has no coverage instrumentation; add
      # --cov=dbus_mqtt_battery to the pytest args once coverage is added.
      coverage-threshold: 0
