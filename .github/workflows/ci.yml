name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@2eba893e177dbeabc2bf93739334bc4da5dc5ab1 # main
    with:
      python-version: '3.12.13'
      # Coverage gate disabled — package has no coverage instrumentation; add
      # --cov=dbus_mqtt_battery to the pytest args once coverage is added.
      coverage-threshold: 0
