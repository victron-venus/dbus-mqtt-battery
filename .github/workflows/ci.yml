name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@062d60e8892d4a97e11f5985d0914d5b19fcd24e # main
    with:
      python-version: '3.12.13'
      # Coverage gate disabled — package has no coverage instrumentation; add
      # --cov=dbus_mqtt_battery to the pytest args once coverage is added.
      coverage-threshold: 0
