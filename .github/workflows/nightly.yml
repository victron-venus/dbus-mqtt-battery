name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  nightly-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create complete PackageManager archive
        run: python3 scripts/build_release.py nightly

      - name: Create GitHub Nightly Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: nightly
          name: "Nightly Build (Development)"
          body: |
            Automated daily package for Venus OS testing.
            Commit: ${{ github.sha }}
          prerelease: true
          overwrite_files: true
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
